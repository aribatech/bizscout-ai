<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizScout AI</title>
  <link rel="icon" href="/frontend/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    /* Logo gradient: deep navy → brighter blue */
    body {
      background: linear-gradient(135deg, #0d1530 0%, #14264f 45%, #2b5cb8 100%);
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center text-white">

  <main class="flex flex-col items-center text-center px-6 max-w-xl">

    <img src="/pics/logo.png" alt="BizScout AI" class="w-24 h-24 rounded-2xl shadow-2xl mb-8">

    <h1 class="text-4xl sm:text-5xl font-bold tracking-tight mb-4">
      BizScout AI
    </h1>

    <p class="text-base sm:text-lg text-blue-100/80 mb-10 leading-relaxed">
      Find local businesses that need your services - and reach the right
      ones, faster.
    </p>

    <div class="flex flex-col sm:flex-row gap-3">
      <a href="/frontend/app.html"
         class="bg-white text-[#14264f] font-semibold px-8 py-3 rounded-lg shadow-lg hover:bg-blue-50 transition">
        Get Started
      </a>
      <a href="/frontend/history.html"
         class="border border-white/30 text-white font-semibold px-8 py-3 rounded-lg hover:bg-white/10 transition">
        View Campaigns
      </a>
    </div>

  </main>

  <p class="absolute bottom-6 text-xs text-blue-100/50">
    &copy; BizScout AI
  </p>

  <a href="http://ariba.techyst.net/" target="_blank" rel="noopener"
     style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;font-size:11px;font-weight:600;padding:6px 12px;border-radius:4px;text-decoration:none;letter-spacing:0.04em;box-shadow:0 2px 8px rgba(0,0,0,0.25);z-index:9999;">
    Built with Ariba ↗
  </a>

</body>
</html>
