<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campaign History</title>
  <link rel="icon" href="/frontend/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 max-w-2xl mx-auto">

  <div class="text-sm mb-6">
    <a href="/frontend/app.html" class="text-blue-500 underline">← New Campaign</a>
  </div>

  <h1 class="text-2xl font-bold mb-6">Past Campaigns</h1>

  <div id="list">
    <p class="text-sm text-gray-400">Loading...</p>
  </div>

  <script>
    function statusStyle(status) {
      if (status === 'COMPLETED') return 'bg-green-100 text-green-700'
      if (status === 'RUNNING')   return 'bg-blue-100 text-blue-600'
      if (status === 'FAILED')    return 'bg-red-100 text-red-600'
      return 'bg-gray-100 text-gray-500'
    }

    async function loadHistory() {
      var res = await fetch('/campaigns')
      var campaigns = await res.json()

      if (!campaigns || campaigns.length === 0) {
        document.getElementById('list').innerHTML = '<p class="text-sm text-gray-400">No campaigns yet. <a href="/frontend/app.html" class="text-blue-500 underline">Start one →</a></p>'
        return
      }

      var html = ''
      for (var i = 0; i < campaigns.length; i++) {
        var c = campaigns[i]
        html += '<div class="py-4' + (i > 0 ? ' border-t' : '') + '">'
        html += '  <div class="flex items-start justify-between gap-2 mb-1">'
        html += '    <p class="font-semibold">' + c.business_niche + ' in ' + c.location + '</p>'
        html += '    <span class="text-xs font-semibold px-2 py-0.5 rounded-full shrink-0 ' + statusStyle(c.status) + '">' + c.status + '</span>'
        html += '  </div>'
        html += '  <p class="text-sm text-gray-400 mb-0.5">' + c.service_offered + '</p>'
        html += '  <p class="text-xs text-gray-400 mb-2">' + new Date(c.created_at).toLocaleString() + '</p>'
        html += '  <div class="flex gap-4 text-xs">'
        html += '    <a href="/frontend/campaign.html?id=' + c.id + '" class="text-blue-500 underline font-semibold">View Campaign →</a>'
        html += '    <a href="/campaigns/' + c.id + '/export" class="text-gray-400 underline">Download CSV</a>'
        html += '  </div>'
        html += '</div>'
      }

      document.getElementById('list').innerHTML = html
    }

    loadHistory()
  </script>

</body>
</html>
