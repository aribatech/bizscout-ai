<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campaign</title>
  <link rel="icon" href="/frontend/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 max-w-2xl mx-auto">

  <div class="flex gap-5 text-sm mb-6">
    <a href="/frontend/app.html" class="text-blue-500 underline">← New Campaign</a>
    <a href="/frontend/history.html" class="text-blue-500 underline">History</a>
  </div>

  <div id="campaign-info" class="mb-1">
    <h1 class="text-xl font-bold">Loading...</h1>
  </div>

  <div class="flex items-center gap-3 mb-6">
    <span id="status-badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">...</span>
    <a id="export-link" href="#" class="ml-auto text-xs text-blue-500 underline">Download CSV</a>
  </div>

<p class="text-sm font-semibold mb-3">Businesses Found <span id="biz-count" class="font-normal text-gray-400"></span></p>
  <div id="biz-list"></div>

  <script>
    var campaignId = new URLSearchParams(window.location.search).get('id')
    if (!campaignId) window.location.href = '/frontend/app.html'

    document.getElementById('export-link').href = '/campaigns/' + campaignId + '/export'

    var logBox = document.getElementById('log-box')
    var pollInterval = setInterval(function() {
      loadCampaign().then(function(status) {
        if (status === 'COMPLETED' || status === 'FAILED') clearInterval(pollInterval)
      })
      loadBusinesses()
    }, 5000)

    function scoreColor(score) {
      if (score >= 70) return 'text-green-600'
      if (score >= 50) return 'text-yellow-500'
      return 'text-red-500'
    }

    function statusBadge(status) {
      if (status === 'COMPLETED') return 'bg-green-100 text-green-700'
      if (status === 'RUNNING')   return 'bg-blue-100 text-blue-600'
      if (status === 'FAILED')    return 'bg-red-100 text-red-600'
      return 'bg-gray-100 text-gray-500'
    }

    async function loadCampaign() {
      var res = await fetch('/campaigns/' + campaignId)
      var c = await res.json()
      document.getElementById('campaign-info').innerHTML =
        '<h1 class="text-xl font-bold">' + c.business_niche + ' in ' + c.location + '</h1>' +
        '<p class="text-sm text-gray-400 mt-0.5 mb-2">' + c.service_offered + '</p>'
      var badge = document.getElementById('status-badge')
      badge.innerText = c.status
      badge.className = 'text-xs font-semibold px-2 py-0.5 rounded-full ' + statusBadge(c.status)
      return c.status
    }

    async function loadBusinesses() {
      var res = await fetch('/campaigns/' + campaignId + '/businesses')
      var businesses = await res.json()

      document.getElementById('biz-count').innerText = '(' + businesses.length + ')'

      if (businesses.length === 0) {
        document.getElementById('biz-list').innerHTML = '<p class="text-sm text-gray-400">No businesses yet — still analyzing...</p>'
        return
      }

      var html = ''
      for (var i = 0; i < businesses.length; i++) {
        var b = businesses[i]
        html += '<div class="flex gap-4 py-4' + (i > 0 ? ' border-t' : '') + '">'
        html += '  <div class="text-center w-10 shrink-0">'
        html += '    <p class="text-xl font-bold ' + scoreColor(b.opportunity_score) + '">' + (b.opportunity_score || '?') + '</p>'
        html += '    <p class="text-xs text-gray-400">/ 100</p>'
        html += '  </div>'
        html += '  <div class="flex-1">'
        html += '    <p class="font-semibold text-sm">' + (b.name || b.website) + '</p>'
        if (b.fit_level) html += '    <p class="text-xs text-gray-400 mb-1">Fit: ' + b.fit_level + ' &nbsp;·&nbsp; Priority: ' + (b.priority || '—') + '</p>'
        if (b.recommended_service) html += '    <p class="text-xs text-gray-400 mb-1">Recommend: ' + b.recommended_service + '</p>'
        html += '    <div class="flex gap-3 text-xs mt-1">'
        if (b.website) html += '      <a href="' + b.website + '" target="_blank" class="text-gray-400 underline">Visit Website</a>'
        html += '      <a href="/frontend/business.html?id=' + b.id + '" class="text-blue-500 underline">View Details →</a>'
        html += '    </div>'
        html += '  </div>'
        html += '</div>'
      }
      document.getElementById('biz-list').innerHTML = html
    }

    loadCampaign()
    loadBusinesses()
  </script>

</body>
</html>
